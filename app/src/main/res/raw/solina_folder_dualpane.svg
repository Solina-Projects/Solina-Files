  <path d="M96 292 Q96 250 138 250 L336 250 Q356 250 371 263 L404 292 Q416 302 432 302 L868 302 Q912 302 912 346 L912 740 Q912 800 852 800 L156 800 Q96 800 96 740 Z" fill="url(#back)"/>
