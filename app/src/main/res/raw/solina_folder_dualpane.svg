<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b8cf0"/><stop offset="1" stop-color="#0a6bcf"/>
  </linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="0.35">
    <stop offset="0" stop-color="#2f93f5"/><stop offset="0.55" stop-color="#22b2e4"/><stop offset="1" stop-color="#2fd0c6"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7fd6ff"/><stop offset="1" stop-color="#8ff3d8"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe9ff" stop-opacity="0.85"/><stop offset="1" stop-color="#9fd0f5" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f4a8f"/><stop offset="1" stop-color="#0a2f66"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b"/>
    <feFlood flood-color="#1fa0ff" flood-opacity="0.45"/>
    <feComposite in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
