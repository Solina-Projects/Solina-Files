name: Solina Files - CI & APK Build

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Solina Files APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew || true
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleRelease || ./gradlew assembleDebug
          fi

      - name: Upload Solina Files APK
        uses: actions/upload-artifact@v7
        with:
          name: Solina-Files-v2.0-Universal-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 60

  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Lint
        run: ./gradlew lint || echo "Lint finished with warnings"
