name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Set the default git branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch PDFium
        run: native/fetch-pdfium.sh

      - name: Build the native core
        run: native/build.sh

      - name: Build the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Check signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SOLINA_KEYSTORE_BASE64 || secrets.STRATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOLINA_KEYSTORE_PASSWORD || secrets.STRATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLINA_KEY_ALIAS || secrets.STRATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLINA_KEY_PASSWORD || secrets.STRATA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing is not configured. No release APK will be built or published."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build the signed release APKs
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        run: |
          version=$(grep '^solina.versionName=' gradle.properties | cut -d= -f2)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME,,}"
            expected_tag="v${version,,}"
            if [[ "$tag_version" != "$expected_tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties."
              exit 1
            fi
          fi

          ./gradlew --stacktrace :app:assembleRelease -Psolina.splitApks=true

          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" \
              "dist/Solina-Files-v${version}-${abi}.apk"
          done

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload ARM64 APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-arm64-v8a
          path: dist/Solina-Files-v*-arm64-v8a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload ARMv7 APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-armeabi-v7a
          path: dist/Solina-Files-v*-armeabi-v7a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Universal APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-universal
          path: dist/Solina-Files-v*-universal.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload checksums and mapping
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-checksums
          path: |
            dist/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Publish or update release
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^solina.versionName=' gradle.properties | cut -d= -f2)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="V${version}"
          fi

          if [[ "${tag,,}" != "v${version,,}" ]]; then
            echo "::error::Tag $tag does not match version $version."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt \
              --title "Solina Files v${version}" \
              --notes "Solina Files ${version}. Includes ARM64, ARMv7 and Universal APKs plus SHA256 checksums."
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks keystore.properties
