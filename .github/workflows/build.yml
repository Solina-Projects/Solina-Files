name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Set the default git branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download Gradle (retry on network timeout)
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew --version; then exit 0; fi
            echo "::warning::Gradle download failed (attempt $attempt of 4), retrying..."
            sleep 20
          done
          echo "::error::Could not download Gradle after 4 attempts."
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch PDFium
        run: native/fetch-pdfium.sh

      - name: Build the native core
        run: native/build.sh

      - name: Build the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Capture APK and dependency baseline
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p app/build/reports/solina-baseline
          ./gradlew --no-configuration-cache :app:dependencies --configuration debugRuntimeClasspath \
            > app/build/reports/solina-baseline/debug-runtime-dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          report = Path("app/build/reports/solina-baseline/debug-apk-size.txt")
          apks = sorted(Path("app/build/outputs/apk/debug").glob("*.apk"))
          lines = ["Solina Files debug APK baseline", ""]
          if not apks:
              raise SystemExit("No debug APK found")
          for apk in apks:
              lines += [f"APK: {apk.name}", f"Compressed APK size: {apk.stat().st_size:,} bytes", ""]
              with ZipFile(apk) as archive:
                  entries = [item for item in archive.infolist() if not item.is_dir()]
                  native = {}
                  for item in entries:
                      if item.filename.startswith("lib/") and item.filename.endswith(".so"):
                          parts = item.filename.split("/")
                          if len(parts) >= 3:
                              native[parts[1]] = native.get(parts[1], 0) + item.file_size
                  lines.append("Native libraries by ABI (uncompressed):")
                  lines.extend(f"  {abi}: {size:,} bytes" for abi, size in sorted(native.items()))
                  lines.append("Largest APK entries (uncompressed):")
                  lines.extend(f"  {item.file_size:>12,}  {item.filename}" for item in
                               sorted(entries, key=lambda item: item.file_size, reverse=True)[:20])
                  lines.append("")
          report.write_text("\\n".join(lines) + "\\n", encoding="utf-8")
          PY

      - name: Upload APK and dependency baseline
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-build-baseline
          path: |
            app/build/reports/solina-baseline/*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Check signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SOLINA_KEYSTORE_BASE64 || secrets.STRATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOLINA_KEYSTORE_PASSWORD || secrets.STRATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLINA_KEY_ALIAS || secrets.STRATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLINA_KEY_PASSWORD || secrets.STRATA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing is not configured. No release APK will be built or published."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build the signed release APKs
        id: release_build
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        run: |
          version=$(grep '^solina.versionName=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME,,}"
            expected_tag="v${version,,}"
            if [[ "$tag_version" != "$expected_tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties."
              exit 1
            fi
          fi

          ./gradlew --stacktrace :app:assembleRelease -Psolina.splitApks=true

          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" \
              "dist/Solina-Files-v${version}-${abi}.apk"
          done

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload ARM64 APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-arm64-v8a
          path: dist/Solina-Files-v*-arm64-v8a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload ARMv7 APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-armeabi-v7a
          path: dist/Solina-Files-v*-armeabi-v7a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Universal APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-universal
          path: dist/Solina-Files-v*-universal.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload versioned ARM64 APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Solina-Files-v${{ steps.release_build.outputs.version }}-arm64-v8a
          path: dist/Solina-Files-v*-arm64-v8a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload checksums and mapping
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-checksums
          path: |
            dist/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Publish or update release
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^solina.versionName=' gradle.properties | cut -d= -f2)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="V${version}"
          fi

          if [[ "${tag,,}" != "v${version,,}" ]]; then
            echo "::error::Tag $tag does not match version $version."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt \
              --title "Solina Files v${version}" \
              --notes "Solina Files ${version}. Includes ARM64, ARMv7 and Universal APKs plus SHA256 checksums."
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks keystore.properties
