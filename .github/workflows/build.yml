name: Build

on:
  push:
    branches: [main, 'refactor/**', 'rewrite/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Set the default git branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download Gradle (retry on network timeout)
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew --version; then exit 0; fi
            echo "::warning::Gradle download failed (attempt $attempt of 4), retrying..."
            sleep 20
          done
          echo "::error::Could not download Gradle after 4 attempts."
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch PDFium
        run: native/fetch-pdfium.sh

      - name: Build the native core
        run: native/build.sh

      - name: Run JVM unit tests
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --stacktrace :app:testDebugUnitTest
      - name: Build the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --stacktrace :app:assembleDebug

      # Release build (R8-minified, arm64-v8a). No release keystore is configured, so Gradle signs it
      # with the debug key: fine for testing, NOT suitable for public distribution.
      - name: Build the release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Capture APK and dependency baseline
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p app/build/reports/solina-baseline
          ./gradlew --no-configuration-cache :app:dependencies --configuration debugRuntimeClasspath \
            > app/build/reports/solina-baseline/debug-runtime-dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          report = Path("app/build/reports/solina-baseline/debug-apk-size.txt")
          apks = sorted(Path("app/build/outputs/apk/debug").glob("*.apk"))
          lines = ["Solina Files debug APK baseline", ""]
          if not apks:
              raise SystemExit("No debug APK found")
          for apk in apks:
              lines += [f"APK: {apk.name}", f"Compressed APK size: {apk.stat().st_size:,} bytes", ""]
              with ZipFile(apk) as archive:
                  entries = [item for item in archive.infolist() if not item.is_dir()]
                  native = {}
                  for item in entries:
                      if item.filename.startswith("lib/") and item.filename.endswith(".so"):
                          parts = item.filename.split("/")
                          if len(parts) >= 3:
                              native[parts[1]] = native.get(parts[1], 0) + item.file_size
                  lines.append("Native libraries by ABI (uncompressed):")
                  lines.extend(f"  {abi}: {size:,} bytes" for abi, size in sorted(native.items()))
                  lines.append("Largest APK entries (uncompressed):")
                  lines.extend(f"  {item.file_size:>12,}  {item.filename}" for item in
                               sorted(entries, key=lambda item: item.file_size, reverse=True)[:20])
                  lines.append("")
          report.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload APK and dependency baseline
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-build-baseline
          path: |
            app/build/reports/solina-baseline/*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload the release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: solina-files-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
