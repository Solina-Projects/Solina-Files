name: One-time Solin identity migration

on:
  push:
    branches:
      - refactor/solin-independent-identity

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Apply independent Solin identity migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/solin-independent-identity
          fetch-depth: 0
      - name: Rename first-party package, source paths, and identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(".")
          protected_names = {"LICENSE", "LICENSE.md", "LICENSE.txt", "NOTICE", "THIRD_PARTY_NOTICES"}
          skip_dirs = {".git", ".gradle", ".idea"}
          text_exts = {".kt", ".java", ".aidl", ".xml", ".kts", ".toml", ".properties", ".yml", ".yaml", ".md", ".json", ".rs", ".sh", ".html", ".gradle", ".pro", ".txt", ".cfg", ".conf", ".py", ".js", ".ts", ".css", ".properties", ".lock"}
          replacements = [
              ("dev.cluvex.strata", "ir.solina.files"),
              ("dev/cluvex/strata", "ir/solina/files"),
              ("Theme.Strata", "Theme.SolinaFiles"),
              ("strata_seed", "solina_seed"),
              ("strata_window_background", "solina_window_background"),
              ("StrataApp", "SolinaFilesApp"),
              ("StrataRootService", "SolinaRootService"),
              ("StrataDrawer", "SolinaDrawer"),
              ("StrataGauge", "SolinaGauge"),
              ("StorageStrata", "StorageSolina"),
              ("drawStrata", "drawSolina"),
              ("Strata", "Solina"),
              ("strata", "solina"),
              ("STRATA", "SOLINA"),
              ("cluvex", "solina"),
          ]

          # Rewrite text references while preserving standalone legal/notice files
          # and copyright/license lines in source files.
          for path in list(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              # Never modify workflow files: GITHUB_TOKEN cannot push workflow changes.
              if rel.parts[:2] == (".github", "workflows"):
                  continue
              if any(part in skip_dirs for part in rel.parts):
                  continue
              # Skip generated outputs, not the legitimate Kotlin package core/build.
              if rel.parts[0] == "build" or rel.parts[:2] == ("app", "build") or rel.parts[:2] == ("native", "target"):
                  continue
              if path.name in protected_names or path.name.startswith("LICENSE"):
                  continue
              if path.suffix.lower() not in text_exts:
                  continue
              try:
                  old = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              lines = old.splitlines(keepends=True)
              changed = False
              new_lines = []
              for line in lines:
                  if "copyright" in line.lower() or "licensed under" in line.lower() or "all rights reserved" in line.lower():
                      new_lines.append(line)
                      continue
                  new_line = line
                  for before, after in replacements:
                      new_line = new_line.replace(before, after)
                  if new_line != line:
                      changed = True
                  new_lines.append(new_line)
              if changed:
                  path.write_text("".join(new_lines), encoding="utf-8")

          # Move the Kotlin/AIDL package tree to the new namespace.
          for old_root in (
              Path("app/src/main/java/dev/cluvex/strata"),
              Path("app/src/main/aidl/dev/cluvex/strata"),
              Path("app/src/test/java/dev/cluvex/strata"),
              Path("app/src/androidTest/java/dev/cluvex/strata"),
          ):
              if old_root.exists():
                  new_root = old_root.parents[2] / "ir/solina/files" if "aidl" not in old_root.parts else old_root.parents[2] / "ir/solina/files"
                  # Use the source-set root rather than relying on package depth.
                  source_root = old_root.parents[2]
                  new_root = source_root / "ir/solina/files"
                  new_root.parent.mkdir(parents=True, exist_ok=True)
                  if new_root.exists():
                      raise RuntimeError(f"Refusing to overwrite existing destination: {new_root}")
                  old_root.rename(new_root)
                  # Remove now-empty legacy package parents.
                  for parent in (old_root.parent, old_root.parent.parent):
                      try:
                          parent.rmdir()
                      except OSError:
                          pass

          # Rename project-specific files and directories after content replacement.
          for path in sorted(root.rglob("*"), key=lambda p: len(p.parts), reverse=True):
              if not path.exists():
                  continue
              rel = path.relative_to(root)
              # Keep every workflow path untouched, including this migration workflow.
              if rel.parts[:2] == (".github", "workflows"):
                  continue
              if rel.parts[0] == "build" or rel.parts[:2] == ("app", "build") or rel.parts[:2] == ("native", "target"):
                  continue
              name = path.name
              new_name = name.replace("Strata", "Solina").replace("strata", "solina").replace("STRATA", "SOLINA").replace("cluvex", "solina")
              if new_name != name:
                  target = path.with_name(new_name)
                  if target.exists():
                      raise RuntimeError(f"Refusing to overwrite renamed path: {target}")
                  path.rename(target)

          # Workflow files are intentionally left untouched because this runner token lacks workflows permission.
          PY
      - name: Audit remaining legacy references
        shell: bash
        run: |
          set -e
          # Keep required third-party/license notices intact; all other tracked project files must be clean.
          if git grep -inE 'strata|cluvex' -- . ':!.github/workflows/**' ':!LICENSE' ':!LICENSE.*' ':!THIRD_PARTY_NOTICES' ':!**/LICENSE' ':!**/LICENSE.*' ':!**/NOTICE' ':!**/THIRD_PARTY_NOTICES'; then
            echo "Legacy identifiers remain outside workflow files and protected legal notices."
            exit 1
          fi
      - name: Commit and push migration
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "Apply independent Solin identity migration"
          git push origin HEAD:refactor/solin-independent-identity
